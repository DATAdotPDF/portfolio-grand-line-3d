<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Pedro D. Ferreira · Data Engineer & Cybersecurity Student</title>
		<meta name="description" content="Pedro D. Ferreira — Data Engineer & Cybersecurity Student | Red Team & Offensive Security | Python · SQL · Automation · Data Quality. Portfólio navegável em 3D.">
		<meta property="og:title" content="Pedro D. Ferreira · Data Engineer & Cybersecurity Student">
		<meta property="og:description" content="Red Team & Offensive Security | Python · SQL · Automation · Data Quality. Portfólio em forma de mundo 3D navegável.">
		<meta property="og:type" content="website">
		<meta name="theme-color" content="#efe4cc">
		<link rel="preload" href="/fonts/IMFellEnglish-Italic.ttf" as="font" type="font/ttf" crossorigin>
		<style>
@font-face { font-family: "IM Fell English"; src: url("/fonts/IMFellEnglish-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "IM Fell English"; font-style: italic; src: url("/fonts/IMFellEnglish-Italic.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("/fonts/JetBrainsMono-Variable.ttf") format("truetype"); font-weight: 100 800; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
:root { --paper: #efe4cc; --ink: #2b2118; --muted: #7a6a55; --line: rgba(43, 33, 24, 0.3); --accent: #9e1b2b; --live: #2f6f47; }
@media (prefers-color-scheme: dark) { :root { --paper: #1d2537; --ink: #efe4cc; --muted: #a9b3c7; --line: rgba(239, 228, 204, 0.3); --accent: #e7a44a; --live: #7fd3a1; } }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: var(--paper); color: var(--ink); overflow: hidden; touch-action: none; font: 400 15px/1.55 "Inter", system-ui, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
	background: var(--paper); visibility: hidden; overflow: auto; touch-action: pan-y; }
.card { width: min(620px, 100%); border: 1px solid var(--line); padding: clamp(20px, 4vw, 34px); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.kicker { font: 600 11px/1.4 "Inter", system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0; }
.status-pill { display: inline-flex; align-items: center; gap: 8px; }
.status-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
h1 { font: italic 400 clamp(44px, 9vw, 72px)/.9 "IM Fell English", Georgia, serif; margin: 14px 0 10px; letter-spacing: -.01em; }
.role { font: 400 24px/1.2 "IM Fell English", Georgia, serif; margin: 0 0 6px; }
.pitch { margin: 12px 0 18px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.links a, .reader-toggle { border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; font-size: 13px; text-decoration: none; letter-spacing: .02em; background: none; cursor: pointer; font-family: inherit; }
.links a:hover, .reader-toggle:hover { border-color: var(--accent); color: var(--accent); }
.loading { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; }
.loading strong { font: italic 400 22px "IM Fell English", Georgia, serif; white-space: nowrap; }
.meter { flex: 1; height: 5px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.meter span { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width .2s; }
.meter.indeterminate span { width: 30%; animation: sweep 1.4s ease-in-out infinite; }
@keyframes sweep { 0% { left: -30%; } 100% { left: 100%; } }
#status-numbers, .hint { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
#status-notice { display: none; border: 1px solid var(--accent); padding: 12px 14px; margin: 14px 0 0; font-size: 14px; }
.reader { display: none; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 8px; }
.reader.open { display: block; }
.reader section { padding: 12px 0; border-bottom: 1px solid var(--line); }
.reader h2 { font: italic 400 26px/1.1 "IM Fell English", Georgia, serif; margin: 4px 0 8px; }
.reader h3 { font: 400 19px/1.2 "IM Fell English", Georgia, serif; margin: 10px 0 2px; }
.reader p { margin: 0 0 8px; }
.reader .mono { font: 400 12.5px "JetBrains Mono", monospace; color: var(--muted); }
/* Slides do carregamento: contam a história enquanto o mundo baixa. */
.slides { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 18px; padding: 12px 0 10px; position: relative; cursor: pointer; }
.slides .track { display: grid; }
.slide { grid-area: 1 / 1; opacity: 0; transform: translateX(14px); transition: opacity .5s, transform .5s; pointer-events: none; }
.slide.on { opacity: 1; transform: none; pointer-events: auto; }
.slide h2 { font: italic 400 24px/1.1 "IM Fell English", Georgia, serif; margin: 4px 0 6px; }
.slide p { margin: 0; font-size: 14px; }
.slide ul { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.slide li { padding: 2px 0; }
.slide .mono { font: 400 11.5px "JetBrains Mono", monospace; color: var(--muted); white-space: nowrap; }
.slide-nav { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.slide-nav button { border: 1px solid var(--line); background: none; color: var(--ink); width: 34px; height: 30px; font: 400 20px/1 "Inter", sans-serif; cursor: pointer; flex: none; }
.slide-nav button:hover { border-color: var(--accent); color: var(--accent); }
.dots { display: flex; gap: 6px; flex: 1; }
.slides .track { min-height: 9.5em; }
.reader section.sheet { border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 18px 20px; margin: 14px 0; background: color-mix(in srgb, var(--paper) 92%, var(--ink)); }
.reader .sheet header { margin-bottom: 10px; }
.reader .sheet h2 { margin: 2px 0 0; }
.reader .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 18px; margin: 14px 0 4px; }
.reader .facts dt { font: 600 11px/1.4 "Inter", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.reader .facts dd { margin: 2px 0 0; font: 400 13px/1.5 "JetBrains Mono", monospace; color: var(--muted); }
.reader .timeline { list-style: none; margin: 8px 0 0; padding: 0 0 0 16px; border-left: 1px solid var(--line); }
.reader .timeline li { position: relative; padding: 4px 0 14px; }
.reader .timeline li::before { content: ""; position: absolute; left: -21px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.reader .timeline .period { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
.reader .timeline h3 { margin: 2px 0 0; }
.reader .timeline .org { font: 600 11px/1.4 "Inter", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 2px 0 6px; }
.reader .projects { display: grid; gap: 10px; margin-top: 10px; }
.reader .project { display: block; border: 1px solid var(--line); padding: 12px 14px; color: var(--ink); text-decoration: none; transition: border-color .2s, transform .2s; }
.reader .project:hover { border-color: var(--accent); transform: translateY(-2px); }
.reader .project h3 { margin: 0 0 4px; }
.reader .project h3 span { color: var(--accent); font-family: "Inter", sans-serif; font-size: .8em; }
.reader .project p { margin: 0 0 6px; font-size: 14px; }
.reader .stack { font: 400 12px/1.5 "JetBrains Mono", monospace; color: var(--muted); margin: 6px 0 0; }
.reader .sheet .links { margin: 14px 0 0; }
.dots i { flex: 1; height: 2px; background: var(--line); position: relative; overflow: hidden; }
.dots i.done { background: var(--ink); }
.dots i.on::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: left; animation: fill 7s linear forwards; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (max-width: 520px) { .pitch { display: none; } h1 { margin-top: 8px; } .links { margin-bottom: 14px; } }
@media (prefers-reduced-motion: reduce) { .meter.indeterminate span { animation: none; width: 100%; opacity: .3; } .slide { transition: none; } }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Seu navegador não suporta canvas.</canvas>

		<!-- Cartão de visita: aparece na hora, enquanto o mundo 3D carrega. -->
		<div id="status" role="status" aria-live="polite">
			<article class="card">
				<p class="kicker status-pill"><!--STATUS--></p>
				<h1><!--NAME--></h1>
				<p class="role"><!--ROLE--></p>
				<p class="kicker"><!--TAGLINE--></p>
				<p class="pitch"><!--PITCH--></p>
				<nav class="links" aria-label="Contatos"><!--LINKS--></nav>
				<div class="slides" id="slides" aria-label="Sobre mim" title="Toque para avançar"><div class="track"><!--SLIDES--></div><div class="slide-nav"><button type="button" id="slide-prev" aria-label="Anterior">‹</button><div class="dots" id="dots"></div><button type="button" id="slide-next" aria-label="Próximo">›</button></div></div>
				<div class="loading"><strong>Içando as velas…</strong><div class="meter indeterminate" id="meter"><span id="meter-bar"></span></div></div>
				<p id="status-numbers">preparando o mar</p>
				<p class="hint">primeira visita ~75 MB (~20 MB no celular) · fica em cache</p>
				<div id="status-notice"></div>
				<p style="margin: 16px 0 0"><button class="reader-toggle" type="button" id="reader-toggle">Ler o portfólio aqui mesmo ↓</button></p>
				<div class="reader" id="reader"><!--READER--></div>
			</article>
		</div>
		<noscript><style>#status { visibility: visible !important; } .reader { display: block !important; }</style></noscript>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const meter = document.getElementById('meter');
	const meterBar = document.getElementById('meter-bar');
	const numbers = document.getElementById('status-numbers');
	const statusNotice = document.getElementById('status-notice');
	const reader = document.getElementById('reader');
	let initializing = true;
	let reading = false;

	// Slides: avançam sozinhos a cada 7 s; um toque passa para o próximo.
	(function () {
		const slides = Array.from(document.querySelectorAll('#slides .slide'));
		const dots = document.getElementById('dots');
		if (!slides.length || !dots) return;
		const marks = slides.map(() => dots.appendChild(document.createElement('i')));
		let current = -1;
		let timer = 0;
		const show = (index) => {
			current = index % slides.length;
			slides.forEach((slide, i) => slide.classList.toggle('on', i === current));
			marks.forEach((mark, i) => { mark.className = i < current ? 'done' : (i === current ? 'on' : ''); });
			clearTimeout(timer);
			timer = setTimeout(() => show(current + 1), 7000);
		};
		document.getElementById('slide-prev').addEventListener('click', (e) => { e.stopPropagation(); show(current - 1 + slides.length); });
		document.getElementById('slide-next').addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });
		document.getElementById('slides').addEventListener('click', () => show(current + 1));
		show(0);
	}());

	// Projetos ao vivo do GitHub (mesma rota que o jogo usa); sem resposta, fica a lista fixa.
	fetch('/api/projetos').then((r) => r.ok ? r.json() : null).then((data) => {
		const section = document.getElementById('reader-projetos');
		if (!data || !data.projects || !data.projects.length || !section) return;
		const grid = section.querySelector('.projects') || section.appendChild(document.createElement('div'));
		grid.className = 'projects';
		grid.replaceChildren();
		const note = document.createElement('p');
		note.className = 'stack';
		note.textContent = 'últimos no GitHub · atualiza sozinho';
		grid.before(note);
		for (const project of data.projects) {
			const card = document.createElement('a');
			card.className = 'project'; card.href = project.url; card.target = '_blank'; card.rel = 'noopener';
			const title = document.createElement('h3');
			title.textContent = project.name.replace(/[_-]/g, ' ') + ' ';
			const arrow = document.createElement('span'); arrow.textContent = '↗'; title.append(arrow);
			card.append(title);
			if (project.description) { const p = document.createElement('p'); p.textContent = project.description; card.append(p); }
			const meta = document.createElement('p');
			meta.className = 'stack';
			meta.textContent = [project.language, ...(project.topics || []).slice(0, 4), 'atualizado ' + new Date(project.pushed_at).toLocaleDateString('pt-BR')].filter(Boolean).join(' · ');
			card.append(meta);
			grid.append(card);
		}
	}).catch(() => {});

	document.getElementById('reader-toggle').addEventListener('click', () => {
		reading = !reader.classList.contains('open');
		reader.classList.toggle('open', reading);
	});

	function hideStatus() {
		initializing = false;
		// Se a pessoa estiver lendo o texto, não arranca o cartão da frente dela.
		if (reading) {
			numbers.textContent = 'mundo 3D pronto';
			const enter = document.createElement('button');
			enter.className = 'reader-toggle';
			enter.textContent = '⚓ Entrar no mundo 3D';
			enter.onclick = () => statusOverlay.remove();
			numbers.after(enter);
			return;
		}
		statusOverlay.remove();
	}

	function displayFailureNotice(err) {
		console.error(err);
		const message = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'erro desconhecido');
		statusNotice.textContent = 'O mundo 3D não abriu neste navegador (' + message + '). O portfólio completo está logo abaixo.';
		statusNotice.style.display = 'block';
		reader.classList.add('open');
		initializing = false;
	}

	// ?texto: só a versão em texto, sem baixar o mundo 3D (conexão ruim ou recrutador com pressa).
	if (new URLSearchParams(location.search).has('texto')) {
		statusOverlay.style.visibility = 'visible';
		reader.classList.add('open');
		reading = true;
		document.querySelector('.loading').style.display = 'none';
		document.querySelector('.hint').style.display = 'none';
		numbers.style.display = 'none';
		const toggle = document.getElementById('reader-toggle');
		toggle.textContent = '⚓ Abrir o mundo 3D';
		toggle.onclick = (e) => { e.stopImmediatePropagation(); location.href = location.pathname; };
		return;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	statusOverlay.style.visibility = 'visible';
	if (missing.length !== 0) {
		displayFailureNotice('recursos ausentes: ' + missing.join(', '));
		return;
	}
	// O jogo (.pck) é servido em partes < 25 MiB (limite do Cloudflare). O navegador
	// baixa as partes (com nova tentativa), junta num buffer e entrega ao Godot — sem depender do Worker.
	async function loadPackParts() {
		// Celular recebe o pacote leve (modelos e texturas menores). ?lite=1 / ?full=1 forçam.
		const query = new URLSearchParams(location.search);
		// Toque sem mouse (celular/tablet); notebook com tela touch continua no pacote completo.
		const touchSmall = matchMedia('(pointer: coarse) and (hover: none)').matches;
		const isMobile = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || touchSmall;
		// Camada 1 do sistema de gráficos: palpite pelo que o navegador revela (o resto é medido no jogo).
		let saved = 'auto';
		try { saved = localStorage.getItem('portfolioGraphics') || 'auto'; } catch (e) {}
		let gpu = '';
		try {
			const gl = document.createElement('canvas').getContext('webgl2');
			const info = gl && gl.getExtension('WEBGL_debug_renderer_info');
			gpu = info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : '';
		} catch (e) {}
		const memory = navigator.deviceMemory || 8;
		const cores = navigator.hardwareConcurrency || 8;
		const weakGpu = /HD Graphics|UHD Graphics 6\d\d|Mali-[GT]?[0-7]\d\b|Adreno \(TM\) [1-5]\d\d|PowerVR|SwiftShader|llvmpipe|Basic Render/i.test(gpu);
		let tier = 'alto';
		// Celular forte (6 GB+, 6+ núcleos: iPhone 15, Galaxy A55...) começa no Médio (60 fps) com o pacote leve;
		// se não segurar, o jogo desce para o Baixo sozinho. Os demais celulares começam no Baixo.
		const strongPhone = isMobile && memory >= 6 && cores >= 6 && !weakGpu;
		if (strongPhone) tier = 'medio';
		else if (isMobile || memory <= 4 || cores <= 2 || weakGpu) tier = 'baixo';
		else if (cores <= 4 || /Intel/i.test(gpu)) tier = 'medio';
		if (saved !== 'auto') tier = saved;
		window.__portfolioGraphics = { mode: saved, tier: tier };
		// Pacote leve (20 MB): celular, aparelho fraco ou quem escolheu Baixo. ?lite=1 / ?full=1 forçam.
		const lite = query.has('lite') || (!query.has('full') && (tier === 'baixo' || (isMobile && saved !== 'alto')));
		if (lite) {
			// Telas 3x faziam o canvas ter ~3 milhões de pixels: memória de vídeo demais para celulares
			// modestos (travava o aparelho). 1.5x continua nítido e custa 1/4 da memória.
			const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
			try { Object.defineProperty(window, 'devicePixelRatio', { get: () => dpr, configurable: true }); } catch (e) {}
		}
		const manifestName = lite ? 'index.mobile.pck.parts.json' : 'index.pck.parts.json';
		let manifest = await fetch(manifestName, { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
		if (!manifest && lite) {
			manifest = await fetch('index.pck.parts.json', { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
		}
		if (!manifest || !manifest.parts) return null;
		let loaded = 0;
		// Um único buffer pré-alocado (evita duplicar ~70 MB de memória no celular).
		const bytes = new Uint8Array(manifest.size);
		for (const part of manifest.parts) {
			const start = loaded;
			for (let attempt = 1; ; attempt++) {
				try {
					loaded = start;
					const response = await fetch((manifest.dir || 'pck') + '/' + part + '?v=' + manifest.version);
					if (!response.ok || !response.body) throw new Error('HTTP ' + response.status);
					const reader = response.body.getReader();
					for (;;) {
						const { done, value } = await reader.read();
						if (done) break;
						bytes.set(value, loaded);
						loaded += value.length;
						meter.classList.remove('indeterminate');
						meterBar.style.width = Math.min(100, loaded / manifest.size * 100).toFixed(1) + '%';
						numbers.textContent = (loaded / 1048576).toFixed(1) + ' / ' + (manifest.size / 1048576).toFixed(1) + ' MB';
					}
					break;
				} catch (error) {
					if (attempt >= 3) throw new Error('falha ao baixar ' + part + ': ' + error.message);
					numbers.textContent = 'reconectando…';
					await new Promise((r) => setTimeout(r, 1200 * attempt));
				}
			}
		}		if (loaded !== manifest.size) throw new Error('download incompleto (' + loaded + ' de ' + manifest.size + ' bytes)');
		return bytes;
	}

	const onProgress = function (current, total) {
		if (!initializing) return;
		if (current > 0 && total > 0) {
			meter.classList.remove('indeterminate');
			meterBar.style.width = Math.min(100, current / total * 100).toFixed(1) + '%';
			numbers.textContent = (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
		}
	};
	loadPackParts().then((bytes) => {
		if (!bytes) {
			return engine.startGame({ 'onProgress': onProgress });
		}
		// Entrega o .pck já montado ao sistema de arquivos do Godot e inicia sem novo download.
		numbers.textContent = 'abrindo o mundo…';
		engine.preloadFile(bytes, 'index.pck');
		return engine.init(GODOT_CONFIG.executable).then(() => engine.start({ 'args': ['--main-pack', 'index.pck'], 'onProgress': onProgress }));
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
	</body>
