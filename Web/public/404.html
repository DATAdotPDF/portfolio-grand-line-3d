<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fora do mapa · Pedro D. Ferreira</title>
	<style>
		@font-face { font-family: "IM Fell English"; font-style: italic; src: url("/fonts/IMFellEnglish-Italic.ttf") format("truetype"); font-display: swap; }
		@font-face { font-family: "Inter"; src: url("/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
		:root { --paper: #efe4cc; --ink: #2b2118; --muted: #7a6a55; --line: rgba(43, 33, 24, 0.3); --accent: #9e1b2b; }
		@media (prefers-color-scheme: dark) { :root { --paper: #1d2537; --ink: #efe4cc; --muted: #a9b3c7; --line: rgba(239, 228, 204, 0.3); --accent: #e7a44a; } }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box;
			background: var(--paper); color: var(--ink); font: 400 16px/1.55 "Inter", system-ui, sans-serif; }
		main { max-width: 560px; border: 1px solid var(--line); padding: 32px; }
		.kicker { font: 600 11px/1.4 "Inter", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0; }
		h1 { font: italic 400 clamp(36px, 7vw, 56px)/1 "IM Fell English", Georgia, serif; margin: 12px 0 14px; }
		a { display: inline-block; margin-top: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 10px 16px; text-decoration: none; }
		a:hover { background: var(--accent); border-color: var(--accent); }
	</style>
</head>
<body>
	<main>
		<p class="kicker">404 · Fora do mapa</p>
		<h1>Essas águas não estão na carta.</h1>
		<p>A página que você procurou não existe. Volte ao mar e siga o Log Pose.</p>
		<a href="/">⚓ Voltar ao mundo</a>
	</main>
</body>
</html>
