# Mesmo Worker/domínio já ativo: portfolio-data-cybersecurity.data-pedutraferreira.workers.dev
name = "portfolio-data-cybersecurity"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# O Worker só roda nestas rotas; o resto é servido direto da borda (mais rápido).
run_worker_first = ["/world", "/world/index.pck", "/world/index.wasm"]
