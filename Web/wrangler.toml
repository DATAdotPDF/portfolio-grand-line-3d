# Portfólio: https://dotpdf.dev (também em portfolio-data-cybersecurity.data-pedutraferreira.workers.dev)
name = "portfolio-data-cybersecurity"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Endereço curto (registrado no Cloudflare). O *.workers.dev continua funcionando.
routes = [
	{ pattern = "dotpdf.dev", custom_domain = true },
	{ pattern = "www.dotpdf.dev", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# O Worker só roda nestas rotas; o resto é servido direto da borda (mais rápido).
run_worker_first = ["/index.pck", "/index.wasm", "/world", "/world/*", "/api/*"]

# Ranking permanente do Desafio (/api/leaderboard).
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "905011cb0e354303beb84b8299d54c0e"
